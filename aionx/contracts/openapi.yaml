openapi: 3.1.0
info:
  title: AionCore client contract (AionX subset)
  version: 0.1.0
  description: |
    Hand-written bridge spec (ADR-001 D1) for the endpoints the Svelte and Flutter
    clients use first. Source of truth is AionCore `aionui-api-types` at
    v0.2.2 (+32, 503a871); `contract.test.ts` checks this file against a live
    pinned aioncore. Wire format is snake_case: serde has no rename_all on these
    types, despite ARCHITECTURE.md describing camelCase.
servers:
  - url: http://127.0.0.1:25818

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access token from POST /login. Browsers use the aionui-session cookie instead.
    sessionCookie:
      type: apiKey
      in: cookie
      name: aionui-session
  schemas:
    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success: { const: false }
        error: { type: string }
        code: { type: string }
        details: {}
    PublicUser:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }
    AuthStatusResponse:
      type: object
      required: [success, needs_setup, user_count, is_authenticated]
      properties:
        success: { type: boolean }
        needs_setup: { type: boolean }
        user_count: { type: integer, minimum: 0 }
        is_authenticated: { type: boolean }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      required: [success, message, user, token]
      properties:
        success: { const: true }
        message: { type: string }
        user: { $ref: '#/components/schemas/PublicUser' }
        token: { type: string, minLength: 1 }
    RefreshTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: Refresh token (native clients). }
    RefreshResponse:
      type: object
      required: [success, token, refresh_token]
      properties:
        success: { const: true }
        token: { type: string, minLength: 1 }
        refresh_token: { type: string, minLength: 1 }
    UserInfoResponse:
      type: object
      required: [success, user]
      properties:
        success: { const: true }
        user: { $ref: '#/components/schemas/PublicUser' }
    WsTokenResponse:
      type: object
      required: [success, ws_token, expires_in]
      properties:
        success: { const: true }
        ws_token: { type: string, minLength: 1 }
        expires_in: { type: integer, minimum: 1 }
    AgentType:
      enum: [acp, openclaw-gateway, nanobot, remote, aionrs, antigravity, gemini, codex]
    ConversationStatus:
      enum: [pending, running, finished]
    ConversationResponse:
      type: object
      required: [id, name, type, status, pinned, created_at, modified_at, extra]
      properties:
        id: { type: string }
        name: { type: string }
        name_source: { type: string }
        type: { $ref: '#/components/schemas/AgentType' }
        model: { type: object }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        runtime: { type: object }
        source: { enum: [aionui, telegram, lark, dingtalk, weixin] }
        pinned: { type: boolean }
        pinned_at: { type: integer }
        channel_chat_id: { type: string }
        assistant: { type: object }
        project_id: { type: string }
        created_at: { type: integer, description: Unix epoch milliseconds }
        modified_at: { type: integer, description: Unix epoch milliseconds }
        extra: {}
    ConversationListResponse:
      type: object
      required: [items, total, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationResponse' }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }

  responses:
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  /api/auth/status:
    get:
      operationId: getAuthStatus
      security: []
      responses:
        '200':
          description: Setup and session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatusResponse' }
  /login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Also sets aionui-session, aionui-refresh and aionui-csrf-token cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      description: |
        CSRF double-submit applies here and to every POST/PUT/PATCH/DELETE, even with
        Bearer auth. Native clients must send `Cookie: aionui-csrf-token=<v>` plus
        `x-csrf-token: <v>` with the same random value. Without them: 403 CSRF_INVALID.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Rotates both tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF_INVALID — missing or mismatched double-submit pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/user:
    get:
      operationId: getCurrentUser
      security: [{ bearer: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/ws-token:
    get:
      operationId: getWsToken
      security: [{ bearer: [] }, { sessionCookie: [] }]
      responses:
        '200':
          description: Short-lived token for the /ws upgrade (Sec-WebSocket-Protocol).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/conversations:
    get:
      operationId: listConversations
      security: [{ bearer: [] }, { sessionCookie: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
        - { name: source, in: query, schema: { type: string } }
        - { name: pinned, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Paginated conversations, wrapped in ApiResponse.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/ConversationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
